name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [prompts, evals]
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-CU10-GDR1-ubuntu-22.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: CiOnly-Passw0rd   # throwaway database inside the CI runner
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CiOnly-Passw0rd -C -b -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    env:
      TEST_DATABASE_URL: mssql://sa:CiOnly-Passw0rd@localhost:1433/promptcheck_test_${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  images:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [prompts, evals]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # GHCR image names must be lowercase (the owner is Liftitnium)
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          build-args: GIT_SHA=${{ github.sha }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ env.OWNER }}/promptcheck-${{ matrix.service }}:${{ github.sha }}

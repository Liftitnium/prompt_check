name: ci

on:
  push:
    branches-ignore: [main]   # main is covered by deploy.yml, which calls this workflow
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [prompts, evals]
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-CU10-GDR1-ubuntu-22.04
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_SA_PASSWORD: CiOnly-Passw0rd   # throwaway database inside the CI runner
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P CiOnly-Passw0rd -C -b -Q 'SELECT 1'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 20s
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    env:
      TEST_DATABASE_URL: mssql://sa:CiOnly-Passw0rd@localhost:1433/promptcheck_test_${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: openapi-spec-validator openapi.yaml
      - run: python -m pytest -q --cov=app --cov-report=term --cov-fail-under=70

  system:
    # system.yaml describes the deployment for grading; it must match the provided schema
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install check-jsonschema==0.29.4
      - run: check-jsonschema --schemafile system.schema.json system.yaml

  integration:
    # the cross-seam test and the UI checks (ADR-9): the real system from docker-compose.yml,
    # called over HTTP and through the UI in a headless browser
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Throwaway passwords for this run's .env
        run: |
          for name in SA_PASSWORD PROMPTS_DB_PASSWORD EVALS_DB_PASSWORD; do
            echo "$name=$(openssl rand -hex 16)Aa1" >> .env
          done
      - run: docker compose up -d --build
      - name: Wait for both services and the UI
        run: |
          for i in $(seq 1 60); do
            curl -sf localhost:8001/health && curl -sf localhost:8002/health && curl -sf -o /dev/null localhost:8080 && exit 0
            sleep 5
          done
          docker compose logs
          exit 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r tests/integration/requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest tests/integration -v
      - if: failure()
        run: docker compose logs

  images:
    needs: [test, integration]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        service: [prompts, evals]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # GHCR image names must be lowercase (the owner is Liftitnium)
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          build-args: GIT_SHA=${{ github.sha }}
          push: ${{ github.ref == 'refs/heads/main' }}
          provenance: false   # otherwise Container Apps can't pull the image from GHCR
          tags: ghcr.io/${{ env.OWNER }}/promptcheck-${{ matrix.service }}:${{ github.sha }}
